name: tom_reflection_generator
description: Standalone reflection generator (builder + CLI) for the Tom framework.
version: 1.1.1
repository: https://github.com/al-the-bear/tom_reflection

environment:
  sdk: ^3.10.4

# Add regular dependencies here.
dependencies:
  analyzer: ^8.0.0
  build: ^4.0.3
  dart_style: ^3.0.0
  glob: ^2.1.2
  logging: ^1.3.0
  path: ^1.9.0
  pub_semver: ^2.2.0
  # tom_analyzer_shared provides the shared analyzer summary-cache
  # infrastructure (SummaryCacheManager, DependencyResolver,
  # SummaryGenerator, runSummaryCacheStage) reused by both this
  # generator and tom_d4rt_generator.
  tom_analyzer_shared: ^0.2.0
  # tom_build_base provides the v2 tool framework (ToolRunner, ToolDefinition,
  # CommandExecutor) used to expose this generator as a single-command,
  # buildkit-nestable CLI tool.
  tom_build_base: any
  tom_reflection: ^1.0.1
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
