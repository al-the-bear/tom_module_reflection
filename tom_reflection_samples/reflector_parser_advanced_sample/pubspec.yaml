name: reflector_parser_advanced_sample
description: >-
  Engine 2 (build-time model) parser advanced — a deep dive into the model:
  type-argument resolution, annotations with arguments, mixins and extensions,
  cycle-safe id references, and YAML round-trip, used to build a non-trivial
  tool over the model.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  tom_reflector:
    path: ../../tom_reflector

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
