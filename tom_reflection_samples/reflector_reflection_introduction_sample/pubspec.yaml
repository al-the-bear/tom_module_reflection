name: reflector_reflection_introduction_sample
description: >-
  Engine 2 (build-time model) reflection introduction — use the analyzer engine
  to generate a *.r.dart reflection file for a small project and consume the
  generated reflection at runtime.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  tom_reflector:
    path: ../../tom_reflector

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
