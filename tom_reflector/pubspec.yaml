name: tom_reflector
description: Analyzer-based code reflection engine for Tom Framework.
version: 1.0.0
publish_to: none
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.10.4

# Add regular dependencies here.
dependencies:
  analyzer: ^10.0.0
  args: ^2.4.0
  collection: ^1.18.0
  crypto: ^3.0.3
  path: ^1.9.0
  yaml: ^3.1.2
  build: ^4.0.4
  tom_reflector_model:
    path: ../tom_reflector_model
  # Shared analyzer-tooling utilities. tom_reflector consumes only the runtime
  # Dart-SDK locator (resolveDartSdkPath) so AOT-compiled binaries find the SDK;
  # it does NOT use the summary-cache feature (see analyzer_context_builder).
  #
  # The floor is 0.7.0 or above even so, because tom_reflector sits above a
  # large part of the workspace: everything resolving through it inherits the
  # bound, and a bound admitting 0.6.x admits the abandoned
  # `.tom/tom_tool_cache/` summary root for those packages that DO use the
  # cache. Pinned to the current release rather than a bare `>=0.7.0` so the
  # floor states what is actually exercised.
  tom_analyzer_shared: ">=0.7.5"
  tom_build_base: ">=2.6.25"
  # The serializable mirror AST (`S*` node types) consumed by
  # lib/src/ast/converter.dart. This is the model package, NOT the interpreter:
  # tom_reflector converts analyzer nodes into mirror nodes and never evaluates
  # them, so it has no need of tom_d4rt_ast's runtime, permissions or stdlib.
  # (tom_d4rt_ast's own barrel is a pass-through re-export of this package, so
  # depending on it bought a larger dependency for an identical surface.)
  #
  # Hosted with a floor rather than a cross-repo `path:`, because a path
  # dependency silently follows whatever the sibling checkout happens to be at
  # — it can move a major version between two `pub get` runs with no diff and no
  # record of what was tested. A floor is that record.
  tom_ast_model: ">=0.2.0"

dev_dependencies:
  build_runner: ^2.4.12
  lints: ^6.0.0
  mocktail: ^1.0.3
  test: ^1.25.6
